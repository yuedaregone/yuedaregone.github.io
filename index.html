<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e6ebf5 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2d3748;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px 0;
        }

        .header h1 {
            font-size: 3em;
            color: #2b6cb0;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 1.3em;
            color: #718096;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .catalog-grid {
            display: grid;
            gap: 20px;
        }

        .catalog-item {
            background: white;
            border-radius: 12px;
            padding: 25px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .catalog-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-color: #cbd5e0;
        }

        .catalog-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }

        .catalog-item:hover::before {
            width: 8px;
        }

        .item-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-title {
            font-size: 1.4em;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.25px;
        }

        .item-description {
            color: #718096;
            font-size: 1em;
            line-height: 1.5;
        }

        .item-arrow {
            font-size: 1.8em;
            color: #a0aec0;
            transition: all 0.3s ease;
            margin-left: 20px;
        }

        .catalog-item:hover .item-arrow {
            color: var(--accent-color);
            transform: translateX(8px);
        }

        .category-tag {
            display: inline-block;
            background: #edf2f7;
            color: #4a5568;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .catalog-item:hover .category-tag {
            background: var(--accent-light);
            color: var(--accent-color);
        }

        /* 不同类别的主题色 */
        .catalog-item:nth-child(1) { --accent-color: #4299e1; --accent-light: #ebf8ff; }
        .catalog-item:nth-child(2) { --accent-color: #48bb78; --accent-light: #f0fff4; }
        .catalog-item:nth-child(3) { --accent-color: #ed8936; --accent-light: #fffaf0; }
        .catalog-item:nth-child(4) { --accent-color: #9f7aea; --accent-light: #faf5ff; }
        .catalog-item:nth-child(5) { --accent-color: #38b2ac; --accent-light: #f0ffff; }
        .catalog-item:nth-child(6) { --accent-color: #ed64a6; --accent-light: #fff5f7; }
        .catalog-item:nth-child(7) { --accent-color: #667eea; --accent-light: #f7fafc; }
        .catalog-item:nth-child(8) { --accent-color: #805ad5; --accent-light: #f5f3ff; }

        .search-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #e2e8f0;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.1em;
            padding: 12px 15px;
            background: #f7fafc;
            border-radius: 8px;
            transition: all 0.3s ease;
            color: #2d3748;
        }

        .search-input:focus {
            background: #edf2f7;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        .search-icon {
            font-size: 1.3em;
            color: #a0aec0;
        }

        .stats-bar {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            border: 1px solid #e2e8f0;
        }

        .stat-item {
            text-align: center;
            padding: 10px;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: 700;
            color: #4299e1;
            display: block;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9em;
            margin-top: 5px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2em;
            }
            
            .catalog-item {
                padding: 20px;
            }
            
            .item-title {
                font-size: 1.2em;
            }
            
            .stats-bar {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 学习目录</h1>
            <p>系统化学习，从点滴开始</p>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="搜索知识模块..." id="searchInput">
        </div>

        <div class="catalog-grid" id="catalogGrid">
            <div class="catalog-item" onclick="openModule('nonviolent-communication')">
                <div class="item-content">
                    <div>
                        <div class="item-title">非暴力沟通</div>
                        <div class="item-description">建立和谐人际关系的高效沟通技巧</div>
                        <span class="category-tag">沟通技巧</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>
            
            <div class="catalog-item" onclick="openModule('learning-pyramid')">
                <div class="item-content">
                    <div>
                        <div class="item-title">学习金字塔</div>
                        <div class="item-description">高效学习的科学方法与策略</div>
                        <span class="category-tag">学习方法</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>
            
            <div class="catalog-item" onclick="openModule('richard-learning')">
                <div class="item-content">
                    <div>
                        <div class="item-title">费曼学习法</div>
                        <div class="item-description">以教代学，输出倒逼输入</div>
                        <span class="category-tag">学习方法</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>
            
            <div class="catalog-item" onclick="openModule('learn-ask')">
                <div class="item-content">
                    <div>
                        <div class="item-title">学会提问</div>
                        <div class="item-description">批判性思维系统指南</div>
                        <span class="category-tag">思维训练</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>

            <div class="catalog-item" onclick="openModule('deliberate-practice')">
                <div class="item-content">
                    <div>
                        <div class="item-title">刻意练习</div>
                        <div class="item-description">从新手到大师的技能提升方法论</div>
                        <span class="category-tag">技能训练</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>

            <div class="catalog-item" onclick="openModule('time-management')">
                <div class="item-content">
                    <div>
                        <div class="item-title">时间规划</div>
                        <div class="item-description">科学管理时间，提升工作效率</div>
                        <span class="category-tag">效率提升</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>

            <div class="catalog-item" onclick="openModule('critical-thinking')">
                <div class="item-content">
                    <div>
                        <div class="item-title">批判性思维</div>
                        <div class="item-description">理性分析，独立思考的核心能力</div>
                        <span class="category-tag">思维训练</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>

            <div class="catalog-item" onclick="openModule('habit-formation')">
                <div class="item-content">
                    <div>
                        <div class="item-title">习惯养成</div>
                        <div class="item-description">建立良好习惯，改变生活方式</div>
                        <span class="category-tag">行为改变</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>

            <div class="catalog-item" onclick="openModule('emotional-intelligence')">
                <div class="item-content">
                    <div>
                        <div class="item-title">情绪管理</div>
                        <div class="item-description">认识情绪，提升情商的有效方法</div>
                        <span class="category-tag">心理调节</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>

            <div class="catalog-item" onclick="openModule('creative-thinking')">
                <div class="item-content">
                    <div>
                        <div class="item-title">创新思维</div>
                        <div class="item-description">打破常规，激发创造力的思维技巧</div>
                        <span class="category-tag">创意思维</span>
                    </div>
                    <div class="item-arrow">→</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 搜索功能
        const searchInput = document.getElementById('searchInput');
        const catalogItems = document.querySelectorAll('.catalog-item');

        searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            
            catalogItems.forEach(item => {
                const title = item.querySelector('.item-title').textContent.toLowerCase();
                const description = item.querySelector('.item-description').textContent.toLowerCase();
                const category = item.querySelector('.category-tag').textContent.toLowerCase();
                
                if (title.includes(searchTerm) || description.includes(searchTerm) || category.includes(searchTerm)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // 打开模块功能
        function openModule(moduleId) {
            // 这里可以根据模块ID跳转到不同的页面
            const moduleUrls = {
                'nonviolent-communication': 'read/nvc.html',
                'deliberate-practice': 'deliberate-practice.html',
                'time-management': 'time-management.html',
                'critical-thinking': 'critical-thinking.html',
                'habit-formation': 'habit-formation.html',
                'learning-pyramid': 'read/study.html',
                'emotional-intelligence': 'emotional-intelligence.html',
                'creative-thinking': 'creative-thinking.html',
				'richard-learning': 'read/fm_lean.html',
				'learn-ask': 'read/tiwen.html',
            };
            
            const url = moduleUrls[moduleId];
            if (url) {
                // 在新窗口中打开
                window.open(url, '_blank');
                // 或者当前页面跳转
                // window.location.href = url;
            } else {
                alert('模块页面正在建设中...');
            }
        }

        // 添加键盘导航
        document.addEventListener('keydown', function(e) {
            if (e.key === '/' && !searchInput.matches(':focus')) {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // 添加滚动效果
        let lastScrollTop = 0;
        window.addEventListener('scroll', function() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const header = document.querySelector('.header');
            
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                header.style.transform = 'translateY(-100%)';
            } else {
                header.style.transform = 'translateY(0)';
            }
            
            lastScrollTop = scrollTop;
        });

        // 添加页面加载动画
        window.addEventListener('load', function() {
            const items = document.querySelectorAll('.catalog-item');
            items.forEach((item, index) => {
                setTimeout(() => {
                    item.style.opacity = '0';
                    item.style.transform = 'translateY(20px)';
                    item.style.transition = 'all 0.5s ease';
                    
                    setTimeout(() => {
                        item.style.opacity = '1';
                        item.style.transform = 'translateY(0)';
                    }, 100);
                }, index * 100);
            });
        });
    </script>
</body>
</html>
